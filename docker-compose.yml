# Drome companion (wishlist + Connect + Mornye auto-download) next to an existing Navidrome.
#
# Your Navidrome already runs as container `navidrome` on network `navidrome_default`
# with music at /srv/storage/Media/Music. This compose joins that network and writes
# new FLACs into the same library.
services:
  drome-server:
    build: ./server
    container_name: drome-server
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "4534:4534"
    environment:
      DROME_NAVIDROME_URL: ${DROME_NAVIDROME_URL:-http://navidrome:4533}
      DROME_SPOTIFY_CLIENT_ID: ${DROME_SPOTIFY_CLIENT_ID}
      DROME_SPOTIFY_CLIENT_SECRET: ${DROME_SPOTIFY_CLIENT_SECRET}
      DROME_SPOTIFY_MARKET: ${DROME_SPOTIFY_MARKET:-US}
      DROME_DB_PATH: /data/drome.db
      DROME_LISTEN_ADDR: :4534
      DROME_MUSIC_DIR: /music
      DROME_AUTO_DOWNLOAD: ${DROME_AUTO_DOWNLOAD:-true}
      # youtube is last-resort (lossy) for Spotify exclusives missing from FLAC stores.
      DROME_SPOTIFLAC_SERVICES: ${DROME_SPOTIFLAC_SERVICES:-tidal,qobuz,amazon,deezer,youtube}
      # Mornye needs an extension registry (no built-in providers).
      MORNYE_REGISTRIES: ${MORNYE_REGISTRIES:-https://raw.githubusercontent.com/mornyeapp/Mornye-Extension/main/registry.json,https://raw.githubusercontent.com/mornyeapp/Mornye-Extension/main/registry-python.json}
      DROME_SPOTIFLAC_EXTENSIONS: ${DROME_SPOTIFLAC_EXTENSIONS:-utilities,tidal-web,qobuz-web,amazon,deezer,ytmusic-spotiflac}
      DROME_SPOTIFY_SINGLE_ALTERNATES: ${DROME_SPOTIFY_SINGLE_ALTERNATES:-true}
      DROME_PUBLIC_URL: ${DROME_PUBLIC_URL:-}
      # Optional: admin (or any user allowed to scan) so downloads appear immediately.
      DROME_NAVIDROME_SCAN_USER: ${DROME_NAVIDROME_SCAN_USER:-}
      DROME_NAVIDROME_SCAN_PASSWORD: ${DROME_NAVIDROME_SCAN_PASSWORD:-}
      # Background "songs you might like" planner → wishlist auto-download.
      # Conservative defaults: 3 tracks/day for cvanhook, skip when queue is busy.
      DROME_OUTSIDE_PLAN_ENABLED: ${DROME_OUTSIDE_PLAN_ENABLED:-false}
      DROME_OUTSIDE_PLAN_USERS: ${DROME_OUTSIDE_PLAN_USERS:-cvanhook}
      DROME_OUTSIDE_PLAN_INTERVAL: ${DROME_OUTSIDE_PLAN_INTERVAL:-24h}
      DROME_OUTSIDE_PLAN_ON_START: ${DROME_OUTSIDE_PLAN_ON_START:-false}
      DROME_OUTSIDE_PLAN_PER_RUN: ${DROME_OUTSIDE_PLAN_PER_RUN:-3}
      DROME_OUTSIDE_PLAN_PER_ARTIST: ${DROME_OUTSIDE_PLAN_PER_ARTIST:-1}
      DROME_OUTSIDE_PLAN_SEED_ARTISTS: ${DROME_OUTSIDE_PLAN_SEED_ARTISTS:-4}
      DROME_OUTSIDE_PLAN_MAX_ACTIVE: ${DROME_OUTSIDE_PLAN_MAX_ACTIVE:-8}
    volumes:
      - ./data/drome-server:/data
      # Persist Mornye extensions + signed sessions across recreates.
      # Host path kept as spotiflac/ for existing installs; container uses ~/.mornye.
      - ./data/drome-server/spotiflac:/home/drome/.mornye
      - /srv/storage/Media/Music:/music
    networks:
      - navidrome_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Guest remote access (Cloudflare Tunnel). Start with:
  #   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile cloudflare up -d
  # Public hostnames are configured in the Cloudflare Zero Trust tunnel UI
  # (music.example.com → http://navidrome:4533). See docs/cloudflare-remote-access.md.
  cloudflared:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - navidrome_default

networks:
  navidrome_default:
    external: true

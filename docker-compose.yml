# Drome companion (wishlist + Connect + SpotiFLAC auto-download) next to an existing Navidrome.
#
# Your Navidrome already runs as container `navidrome` on network `navidrome_default`
# with music at /srv/storage/Media/Music. This compose joins that network and writes
# new FLACs into the same library.
services:
  drome-server:
    build: ./server
    container_name: drome-server
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "4534:4534"
    environment:
      DROME_NAVIDROME_URL: http://navidrome:4533
      DROME_SPOTIFY_CLIENT_ID: ${DROME_SPOTIFY_CLIENT_ID}
      DROME_SPOTIFY_CLIENT_SECRET: ${DROME_SPOTIFY_CLIENT_SECRET}
      DROME_SPOTIFY_MARKET: ${DROME_SPOTIFY_MARKET:-US}
      DROME_DB_PATH: /data/drome.db
      DROME_LISTEN_ADDR: :4534
      DROME_MUSIC_DIR: /music
      DROME_AUTO_DOWNLOAD: ${DROME_AUTO_DOWNLOAD:-true}
      DROME_SPOTIFLAC_SERVICES: ${DROME_SPOTIFLAC_SERVICES:-tidal,qobuz,amazon,deezer}
      DROME_PUBLIC_URL: ${DROME_PUBLIC_URL:-}
      # Optional: admin (or any user allowed to scan) so downloads appear immediately.
      DROME_NAVIDROME_SCAN_USER: ${DROME_NAVIDROME_SCAN_USER:-}
      DROME_NAVIDROME_SCAN_PASSWORD: ${DROME_NAVIDROME_SCAN_PASSWORD:-}
    volumes:
      - ./data/drome-server:/data
      - /srv/storage/Media/Music:/music
    networks:
      - navidrome_default
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  navidrome_default:
    external: true
